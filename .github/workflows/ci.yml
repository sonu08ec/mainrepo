name: CI

on:
  push:
    branches: [ master ]
    paths:
      - 'simple_project/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-app ./simple_project

      - name: Run container
        run: docker run -d -p 5000:5000 --name myapp devops-app

      - name: Test the app
        run: |
          sleep 5
          curl --fail localhost:5000
          curl --fail localhost:5000/health

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Tag and push image
        run: |
          docker tag devops-app ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest
