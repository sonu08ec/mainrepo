name: vRAN DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-build:
    name: Syntax Check & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Syntax Check Application Code
        run: |
          python -m py_compile src/app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -f Dockerfile -t vran-node:${{ github.sha }} .

  deploy-to-kind:
    name: Test Deployment on Kind
    needs: lint-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Local Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: vran-cluster

      - name: Build Docker Image
        run: |
          docker build -t vran-node:${{ github.sha }} .

      - name: Load Image into Kind Cluster
        run: |
          kind load docker-image vran-node:${{ github.sha }} --name vran-cluster

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yaml
          kubectl rollout status deployment/vran-node-deployment --timeout=60s || true
          kubectl get pods -A
