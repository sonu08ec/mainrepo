name: vRAN DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax Check Application Code
        run: |
          python -m py_compile src/app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t vran-node:${{ github.sha }} ./src

  deploy-to-kind:
    name: Test Deployment on Kind
    needs: lint-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Local Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: vran-cluster
          config: k8s/kind-config.yaml

      - name: Build Docker Image
        run: |
          docker build -t vran-node:v1.0 ./src

      - name: Load Image into Kind Cluster
        run: |
          kind load docker-image vran-node:v1.0 --name vran-cluster

      - name: Deploy Manifests to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml

      - name: Verify Pod Deployment Status
        run: |
          kubectl rollout status deployment/vran-node-deployment --timeout=90s
          kubectl get pods -o wide

      - name: Check Container Logs
        run: |
          sleep 10
          kubectl logs -l app=vran-node --tail=20
